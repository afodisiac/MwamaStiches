<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Description Page</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="product-page">
        <div class="product-container">
            <!-- Product Images -->
            <div class="product-images">
                <img id="product-image" src="afodisiac/IMG-20220819-WA0013.jpg" alt="Product Image">
                <div class="color-options">
                    <button class="color-option" data-color="blue" style="background-color: blue;"></button>
                    <button class="color-option" data-color="red" style="background-color: red;"></button>
                    <button class="color-option" data-color="green" style="background-color: green;"></button>
                </div>
            </div>

            <!-- Product Details -->
            <div class="product-details">
                <h1 id="product-name">Stylish Jacket</h1>
                <p id="product-price">$129.99</p>
                <p id="product-sizes">Available Sizes: S, M, L, XL</p>
                <button class="add-to-cart">Add to Cart</button>
            </div>
        </div>

        <!-- Similar Products Section -->
        <section class="similar-products">
            <h2>Similar Products</h2>
            <div class="product-list">
                <div class="product-item">
                    <img src="product-similar1.jpg" alt="Product 1">
                    <p>Cozy Hoodie</p>
                    <p>$79.99</p>
                </div>
                <div class="product-item">
                    <img src="product-similar2.jpg" alt="Product 2">
                    <p>Winter Coat</p>
                    <p>$150.00</p>
                </div>
                <div class="product-item">
                    <img src="product-similar3.jpg" alt="Product 3">
                    <p>Casual T-shirt</p>
                    <p>$39.99</p>
                </div>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
